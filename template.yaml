AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  Nzyme Task Tracker — webhook-driven sync engine. Template injection via Notion automation webhook, AI extraction via scheduled cron.

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - x86_64
    Environment:
      Variables:
        NOTION_API_TOKEN: !Ref NotionApiToken
        OPENAI_API_KEY: !Ref OpenAIApiKey
        TEAM_TRACKER_DB_ID: !Ref TeamTrackerDbId
        TASK_ARCHIVE_DB_ID: !Ref TaskArchiveDbId
        MEETING_TEMPLATE_PAGE_ID: !Ref MeetingTemplatePageId
        INJECT_TEMPLATE: !Ref InjectTemplate
        WEBHOOK_PATH_TOKEN: !Ref WebhookPathToken
        IDLE_MINUTES: !Ref IdleMinutes
        LOG_LEVEL: !Ref LogLevel
        DRY_RUN: !Ref DryRun
        INCLUDE_AI_NOTES: !Ref IncludeAINotes
        BUFFER_HOURS: !Ref BufferHours
        DEAL_WORKPLANS_DB_ID: !Ref DealWorkplansDbId
        SEMANTIC_DEDUP_THRESHOLD: !Ref SemanticDedupThreshold
        GOOGLE_SERVICE_ACCOUNT_SECRET_ARN: !Ref GoogleServiceAccountSecretArn
        GCAL_DELEGATED_USER_DEFAULT: !Ref GCalDelegatedUserDefault
        GCAL_PROXY_DELEGATED_USER: !Ref GCalProxyDelegatedUser
        GCAL_PROXY_DOMAINS: !Ref GCalProxyDomains
        GEMINI_API_KEY: !Ref GeminiApiKey
        GEMINI_MODEL: !Ref GeminiModel
        GEMINI_BASE_URL: !Ref GeminiBaseUrl
        OPENAI_MODEL: !Ref OpenAIModel
        TERMINOLOGY_DB_ID: !Ref TerminologyDbId
        ORG_CHART_DB_ID: !Ref OrgChartDbId
        CLASSIFIER_PROMPT_PAGE_ID: !Ref ClassifierPromptPageId
        MERGED_TRANSCRIPT_EXTRACTION_PROMPT_PAGE_ID: !Ref MergedTranscriptExtractionPromptPageId
        LITERAL_NOTES_EXTRACTION_PROMPT_PAGE_ID: !Ref LiteralNotesExtractionPromptPageId
        LOGFIRE_TOKEN: !Ref LogfireToken
        TOPIC_MIRROR_ENABLED: !Ref TopicMirrorEnabled
        # Both env vars resolve to the same DB id for one deploy cycle.
        # MEETING_RULES_DB_ID is the new name; TOPIC_MIRROR_ROUTES_DB_ID is
        # kept for back-compat with .env files until the next deploy.
        MEETING_RULES_DB_ID: !Ref MeetingRulesDbId
        TOPIC_MIRROR_ROUTES_DB_ID: !Ref MeetingRulesDbId
        HIERARCHY_DB_ID: !Ref HierarchyDbId
        DETAIL_OPTIONS_DB_ID: !Ref DetailOptionsDbId
        EXTERNAL_ORGS_DB_ID: !Ref ExternalOrgsDbId
        SUPABASE_URL: !Ref SupabaseUrl
        SUPABASE_KEY: !Ref SupabaseKey

Parameters:
  NotionApiToken:
    Type: String
    NoEcho: true
  OpenAIApiKey:
    Type: String
    NoEcho: true
  TeamTrackerDbId:
    Type: String
  TaskArchiveDbId:
    Type: String
    Default: ''
    Description: Notion DB ID for the Team Task Tracker — Archive (destination for the weekly Done-task sweep). Leave empty to disable the weekly archive job.
  MeetingTemplatePageId:
    Type: String
    Default: ''
  InjectTemplate:
    Type: String
    Default: 'true'
  WebhookPathToken:
    Type: String
    NoEcho: true
  IdleMinutes:
    Type: String
    Default: '3'
  LogLevel:
    Type: String
    Default: INFO
  DryRun:
    Type: String
    Default: 'false'
  IncludeAINotes:
    Type: String
    Default: 'false'
  BufferHours:
    Type: String
    Default: '2'
  DealWorkplansDbId:
    Type: String
    Default: ''
  SemanticDedupThreshold:
    Type: String
    Default: '0.85'
  GoogleServiceAccountSecretArn:
    Type: String
    Default: ''
    Description: ARN of the Secrets Manager secret holding the Google service-account JSON. Leave empty to disable GCal.
    NoEcho: true
  GCalDelegatedUserDefault:
    Type: String
    Default: ''
    Description: Default Workspace email to impersonate when the meeting creator can't be resolved.
  GCalProxyDelegatedUser:
    Type: String
    Default: ''
    Description: In-domain proxy email to impersonate for out-of-domain meeting owners (see GCalProxyDomains). Must have "see all event details" access to their calendars. Empty = disabled.
  GCalProxyDomains:
    Type: String
    Default: ''
    Description: Comma-separated email domains DWD can't impersonate directly (e.g. nzalpha.com); read via GCalProxyDelegatedUser.
  GeminiApiKey:
    Type: String
    Default: ''
    Description: Google Gemini API key for heavy LLM calls (transcript correction, task extraction).
    NoEcho: true
  GeminiModel:
    Type: String
    Default: gemini-3-flash-preview
    Description: Gemini model for heavy LLM calls.
  GeminiBaseUrl:
    Type: String
    Default: https://generativelanguage.googleapis.com/v1beta/openai/
    Description: Gemini OpenAI-compatible base URL.
  OpenAIModel:
    Type: String
    Default: gpt-5-mini
    Description: OpenAI model for light LLM calls (classifier + fundraising summary).
  TerminologyDbId:
    Type: String
    Default: ''
    Description: Notion Terminology DB ID (transcript correction context).
  OrgChartDbId:
    Type: String
    Default: ''
    Description: |
      Notion Org Chart DB ID. Required in production — drives discovery of
      per-member Meeting Notes DBs via the "Meeting Notes DB" URL column on
      each active row, plus transcript classification and GCal name resolution.
  ClassifierPromptPageId:
    Type: String
    Default: ''
    Description: Notion page ID for the transcript classifier system prompt.
  MergedTranscriptExtractionPromptPageId:
    Type: String
    Description: |
      Notion page ID for the merged transcript-extraction system prompt.
      REQUIRED — pipeline raises at startup if unset and at ctx-load if the
      page is empty or inaccessible. No in-code fallback.
  LiteralNotesExtractionPromptPageId:
    Type: String
    Default: ''
    Description: |
      Notion page ID for the literal-notes extraction prompt. Required when any
      Org Chart row has Auto-extract Tasks = false (i.e. all of them in MVP).
      The pipeline reads this page on every run so prompt edits take effect
      live without redeploy.
  LogfireToken:
    Type: String
    Default: ''
    Description: Logfire token for tracing LLM calls.
    NoEcho: true
  TopicMirrorEnabled:
    Type: String
    Default: 'false'
    Description: Enable cloning of tagged meetings into Meeting Mirrors topic DBs.
  MeetingRulesDbId:
    Type: String
    Default: ''
    Description: |
      Notion DB ID for the Meeting Rules registry (was: Topic Mirror Routes).
      Each row maps a tag (Match Property + Match Value) to an Action:
      'Mirror to DB' (clone meeting into target DB) or 'Fire Affinity LP Funnel
      (no transcript)' / '... (with transcript)' (mirrored to Supabase for the
      standalone fundraising Lambda to consume). Required when
      TopicMirrorEnabled = true.
  HierarchyDbId:
    Type: String
    Default: ''
    Description: |
      Notion DB ID for the 'Meeting Notes & Task Tracker Hierarchy' database.
      Source of truth for Tier 0 Macro Work Blocks. Required when the daily
      Hierarchy sync cron is enabled.
  DetailOptionsDbId:
    Type: String
    Default: ''
    Description: |
      Notion DB ID for the 'Detail Options' Settings DB. Source of truth for
      member-DB `Detail` multi-select options. Empty disables the
      detail_canonical_mirror_sync + detail_applier_sync sub-syncs (they skip
      with a benign warning).
  ExternalOrgsDbId:
    Type: String
    Default: ''
    Description: |
      DEPRECATED 2026-06-02 — dead config. Was the '🏢 External Orgs' Settings
      DB mirror target; replaced by deal_hierarchy_sync (Hierarchy DB rows) +
      external_org_applier_sync (member-DB External Org fan-out). Nothing reads
      it; safe to drop in a future cleanup.
  SupabaseUrl:
    Type: String
    Default: ''
    Description: Supabase project URL (e.g. https://yphbrpbwpakjduhmoimw.supabase.co). When empty, the Supabase sync jobs are still scheduled but will fail loudly at runtime — set both this and SupabaseKey to enable.
  SupabaseKey:
    Type: String
    Default: ''
    Description: Supabase service-role key (RLS bypass — required because the meeting_transcripts table is RLS-enabled with no policies).
    NoEcho: true
  AlertEmail:
    Type: String
    Default: ''
    Description: |
      Email for CloudWatch alarm notifications (Supabase sync staleness).
      The mirror is the read surface for the consumer Lambdas, so a stalled
      sync starves everything downstream. Empty = alarm exists but notifies
      nobody (visible in the CloudWatch console only).

Conditions:
  GCalEnabled: !Not [!Equals [!Ref GoogleServiceAccountSecretArn, '']]
  AlertsEnabled: !Not [!Equals [!Ref AlertEmail, '']]

Resources:
  NzymeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: nzyme-task-tracker
      Handler: src.webhook.lambda_handler.handler
      CodeUri: .
      MemorySize: 512
      # Transcript pipeline = 3 sequential LLM calls (correct → extract →
      # classify) per meeting. End-to-end runs ~60–110s for typical meetings;
      # 120s left no headroom and timed out the 2026-04-21 fundraising test
      # mid-classifier. 300s gives ~3x margin for the slow tail.
      Timeout: 300
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: !Ref LogLevel
        SystemLogLevel: WARN
      Policies:
        - !If
          - GCalEnabled
          - Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref GoogleServiceAccountSecretArn
          - !Ref AWS::NoValue
      Events:
        WebhookPost:
          Type: HttpApi
          Properties:
            Path: /webhook/{token}
            Method: POST
            ApiId: !Ref HttpApi
        ScheduledExtraction:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Description: Check for idle meeting pages and run AI extraction
            Enabled: true
        SupabaseSync:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Description: Incremental Notion → Supabase sync. Pulls pages where last_edited_time has advanced past the per-DB checkpoint stored in Supabase and upserts them into meeting_transcripts.
            Enabled: true
            Input: '{"source": "aws.events", "job": "supabase_sync"}'
        SupabaseWeeklySync:
          Type: Schedule
          Properties:
            Schedule: cron(0 7 ? * SUN *)
            Description: Sunday safety-net — re-sync every meeting page edited in the last 14 days, regardless of checkpoint. Sunday 07:00 UTC.
            Enabled: true
            Input: '{"source": "aws.events", "job": "supabase_sync_full"}'
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: AlertsEnabled
    Properties:
      TopicName: nzyme-task-tracker-alerts
      Subscription:
        - Endpoint: !Ref AlertEmail
          Protocol: email

  # Counts the per-tick "supabase sync heartbeat:" INFO line emitted by
  # _handle_supabase_sync (webhook/lambda_handler.py). The exact wording is
  # load-bearing — keep filter and log line in sync.
  SupabaseSyncHeartbeatFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: /aws/lambda/nzyme-task-tracker
      FilterPattern: '{ $.message = "supabase sync heartbeat*" }'
      MetricTransformations:
        - MetricNamespace: Nzyme
          MetricName: SupabaseSyncHeartbeat
          MetricValue: '1'
          Unit: Count

  # The sync runs every 5 min → expect ≥3 heartbeats per 15-min period.
  # Three consecutive periods with <1 heartbeat (= 45 min of silence:
  # crashes, throttles, a disabled rule, or a paused Lambda) → ALARM.
  # TreatMissingData breaching catches total silence, not just errors.
  SupabaseSyncStalledAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: nzyme-supabase-sync-stalled
      AlarmDescription: >-
        No "supabase sync heartbeat" log line for 45 minutes. The Notion →
        Supabase mirror feeds the consumer Lambdas (fundraising/extraction/
        topic-mirror); a stalled sync silently starves them all.
      Namespace: Nzyme
      MetricName: SupabaseSyncHeartbeat
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: !If [AlertsEnabled, [!Ref AlertTopic], []]
      OKActions: !If [AlertsEnabled, [!Ref AlertTopic], []]

Outputs:
  WebhookUrl:
    Description: URL for the Notion automation webhook (append your secret token)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/webhook/{your-token}
  FunctionArn:
    Value: !GetAtt NzymeFunction.Arn